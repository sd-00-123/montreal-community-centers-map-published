name: Deploy map to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir dist
          cp site/index.html site/app.js site/style.css dist/
          cp -r site/vendor dist/
          cp mtl_bound.geojson stops_clean_output.geojson \
            mtl_places_clean_output.geojson shapes.csv dist/
          mkdir -p dist/MetroStops
          cp MetroStops/MetroStops.geojson dist/MetroStops/
          mkdir -p dist/site
          cp site/index.html site/app.js site/style.css dist/site/
          cp -r site/vendor dist/site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
